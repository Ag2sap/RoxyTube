name: Python syntax

on:
  push:
    branches:
      - feature/tv-ui-single-layer
      - feature/plasmatube-style-ui
      - roxytube-safearea
      - feat/mpv-drmprime-ytdlp
  pull_request:
    branches:
      - main
      - baseline/1080p-working-7764896

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application source
        run: python -m py_compile app/main.py
