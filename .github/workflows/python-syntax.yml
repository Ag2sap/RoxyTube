name: Python syntax

on:
  push:
    branches:
      - feature/tv-ui-single-layer
      - feature/plasmatube-style-ui
      - feature/channel-playback-ytdlp-opt
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application source
        run: python -m py_compile app/main.py
      - name: Check Channel and playback contracts
        run: python -m unittest discover -s tests -v
      - name: Check shell script syntax
        run: |
          sh -n scripts/deploy-hg680p.sh
          sh -n scripts/run.sh
          sh -n scripts/install-yt-dlp.sh
          sh -n scripts/install-deno.sh
          sh -n scripts/install-drmprime-runtime.sh
          bash -n scripts/build-drmprime-runtime.sh
          bash -n scripts/check-drmprime-patch.sh
