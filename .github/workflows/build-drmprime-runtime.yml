name: Build ARM64 DRM PRIME runtime

on:
  push:
    branches:
      - feat/mpv-drmprime-ytdlp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates pkg-config meson ninja-build \
            python3 python3-jinja2 nasm yasm \
            libdrm-dev libx11-dev libxext-dev libxrandr-dev libxv-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl-dev libgbm-dev \
            libasound2-dev libass-dev libuchardet-dev libssl-dev zlib1g-dev \
            libfreetype-dev libfontconfig1-dev libfribidi-dev libharfbuzz-dev
      - name: Build isolated FFmpeg and MPV DRM PRIME runtime
        run: bash scripts/build-drmprime-runtime.sh
      - name: Upload ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: roxytube-mpv-drmprime-aarch64
          path: |
            dist/roxytube-mpv-drmprime-aarch64.tar.gz
            dist/roxytube-mpv-drmprime-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
